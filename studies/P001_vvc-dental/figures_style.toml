# The style of the figures and tables of P001 (STUDY.md section 7, «Вид рядов», «Линии с маленькими маркерами»;
# ../../../REFERENCE.md#studies, 4). A change here and a new run of figures.py change the look; the data are not computed again.

[page]
column_cm = 8.8         # one column of J. Electr. Eng. - measured on the samples (PAPER.md, 2026-10-27)
double_column_cm = 18.1 # the full width of the text - the same measurement
dpi = 600               # the plots; the image figures take the dpi at which their panels are whole multiples of pixels
font = "Times New Roman"
font_fallback = "DejaVu Serif"  # taken when the font is not installed; figures.py names the font it took
font_size_pt = 8
line_width_pt = 1.0
marker_size_pt = 2.5    # small markers on the lines; markers alone and large markers are not allowed (owner, 2026-10-27)
markevery_max = 25      # at most this many markers on one line, evenly along it
image_margin_pt = 2.0   # the image figures: the margin around the panels
image_gap_pt = 4.0      # the image figures: the gap between the panels

# colours of STUDY.md section 7 (Okabe-Ito; AVIF #CC79A7 - owner decision, cycle 12); a line style and a marker each
[codecs.vtm]
label = "VVC"           # "VVC" everywhere in the paper; VTM only as the implementation in Table 1 (owner, 2026-10-27)
color = "#0072B2"
line = "solid"
marker = "o"

[codecs.jpeg]
label = "JPEG"
color = "#D55E00"
line = "dashed"
marker = "s"

[codecs.heif]
label = "HEIF"
color = "#000000"
line = "dotted"
marker = "^"

[codecs.avif]
label = "AVIF"
color = "#CC79A7"
line = "dashdot"
marker = "D"

[thresholds]
color = "#7F7F7F"       # the threshold lines and r = 1 are grey
line_40 = "dotted"
line_41 = "dashed"
line_42 = "solid"
unity_line = "dashed"   # r = 1 on Fig. 3 (b)

[figures]
fig1_fragment_scale = 3       # Fig. 1, one row: in the PNG the image is 1 : 1, the fragments (b), (c) - repeated this many times
fig1_grid_color = "#56B4E9"   # the frames of the grid of the image (a)
fig1_grid_width_pt = 0.5
fig1_mark_color = "#D55E00"   # the frames and letters of the fragments (b), (c) on (a)
fig1_mark_width_pt = 1.0
fig2_width = "double"         # "column" or "double"
fig2_height_cm = 12.0
fig2_legend_columns = 7       # one legend above the four panels
fig3_width = "double"         # Fig. 3, PSNR-HVS-M on PCC: a panel per codec, 2 x 2
fig3_height_cm = 10.0
fig3_simple_line = "solid"    # the fragment of simple structure of Fig. 2, in the colour of the codec
fig3_complex_line = "dashed"  # the fragment of complex structure of Fig. 2
fig3_legend = "best"          # the legend of the two fragments in every panel; the thresholds - one legend above
fig3_vvc_ymax_db = 80         # panel (a) VVC: the top of the y axis, dB - the points above are cut (owner, cycle 23)
fig4_width = "double"         # Fig. 4, the threshold PCC on MGM: a panel per codec in one row, markers without lines
fig4_height_cm = 6.0
fig5_width = "double"         # Fig. 5, the effect r with its CI: (a) the patients, (b) the whole images, markers and CI
fig5_height_cm = 6.0
fig6_width = "column"         # Fig. 6 (Fig. 3 before cycle 22)
fig6_height_cm = 10.0
fig6_legend = "upper right"
fig6_legend_columns = 2
fig6_legend_headroom = 0.3    # the y axis of both panels goes higher by this share of its span - room for the legend
fig7_scale = 2                # Fig. 7 (Fig. 4 before cycle 22): in the PNG every panel is repeated this many times
                              # (the region - ZOOM times more)
fig7_frame_color = "#D55E00"  # the frame of the region on the upper row
fig7_frame_width_pt = 0.8
