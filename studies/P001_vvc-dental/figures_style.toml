# The style of the figures and tables of P001 (STUDY.md section 7, «Вид рядов»; ../../../REFERENCE.md#studies, 4).
# A change here and a new run of figures.py change the look; the data are not computed again.

[page]
column_cm = 8.4         # one column - ASSUMPTION from the samples of J. Electr. Eng. (A4, two columns); PAPER.md: no figure rules found
double_column_cm = 17.4 # two columns - the same assumption
height_cm = 6.5
dpi = 600
font = "DejaVu Sans"
font_size_pt = 8
line_width_pt = 1.0
marker_size_pt = 4.0
legend = "best"

# colours of STUDY.md section 7 (Okabe-Ito; AVIF #CC79A7 - owner decision, cycle 12); a line style and a marker each
[codecs.vtm]
label = "VVC (VTM)"
color = "#0072B2"
line = "solid"
marker = "o"

[codecs.jpeg]
label = "JPEG"
color = "#D55E00"
line = "dashed"
marker = "s"

[codecs.heif]
label = "HEIF"
color = "#000000"
line = "dotted"
marker = "^"

[codecs.avif]
label = "AVIF"
color = "#CC79A7"
line = "dashdot"
marker = "D"

[thresholds]
color = "#7F7F7F"
line_40 = "dotted"
line_41 = "dashed"
line_42 = "solid"

[figures]
fig1_width = "column"
fig2_width = "column"
fig3_width = "column"
threshold_marker_size_pt = 8.0   # the threshold points at 42 dB on Fig. 1: the codec's marker, hollow and larger
