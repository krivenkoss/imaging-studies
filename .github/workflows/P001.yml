name: P001
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "studies/P001_vvc-dental/**"
      - "pyproject.toml"
      - ".github/workflows/P001.yml"
  pull_request:
    paths:
      - "src/**"
      - "studies/P001_vvc-dental/**"
      - "pyproject.toml"
      - ".github/workflows/P001.yml"
  workflow_dispatch:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q -m core studies/P001_vvc-dental/tests
